<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeptemStudy - 7-Course Slide Quiz & Weekly Performance Tracker</title>
    <meta name="description" content="Comprehensive academic study companion for 6 university courses: AI slide quizzing, flashcards, topic summarization, and detailed weekly performance reports." />
    <meta property="og:title" content="SeptemStudy - 7-Course Slide Quiz & Weekly Performance Tracker" />
    <meta property="og:description" content="Comprehensive academic study companion for 6 university courses: AI slide quizzing, flashcards, topic summarization, and detailed weekly performance reports." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress benign dev-server WebSocket disconnect errors in iFrame dev previews
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (event.reason.message?.includes('WebSocket') ||
            String(event.reason).includes('WebSocket') ||
            event.reason.stack?.includes('@vite/client'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        if (
          event.message?.includes('WebSocket') ||
          event.filename?.includes('@vite/client')
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
